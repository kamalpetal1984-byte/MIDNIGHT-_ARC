<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDNIGHT ARC</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- Google Fonts & Lucide Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --bg-dark: #050b07;
      --bg-card: #0b1710;
      --bg-card-hover: #122419;
      --accent-emerald: #00FF88;
      --emerald-glow: rgba(0, 255, 136, 0.25);
      --emerald-subtle: rgba(0, 255, 136, 0.08);
      --text-main: #f0fff6;
      --text-muted: #6b8a78;
      --border-emerald: rgba(0, 255, 136, 0.18);
      --danger: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Auth Screens */
    .auth-container {
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 1.5rem;
      margin: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-emerald);
      border-radius: 20px;
      box-shadow: 0 0 35px var(--emerald-glow);
    }

    .auth-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-emerald);
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 10px var(--emerald-glow);
    }

    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--accent-emerald);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-control {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #030704;
      border: 1px solid var(--border-emerald);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 12px var(--emerald-glow);
    }

    .btn-emerald {
      width: 100%;
      padding: 0.9rem;
      background: var(--accent-emerald);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px var(--emerald-glow);
    }

    .btn-emerald:hover {
      background: #00db75;
      transform: translateY(-1px);
    }

    .auth-toggle {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .auth-toggle span {
      color: var(--accent-emerald);
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
    }

    /* Main App Layout */
    .app-viewport {
      width: 100%;
      max-width: 480px;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid rgba(0, 255, 136, 0.1);
      border-right: 1px solid rgba(0, 255, 136, 0.1);
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 11, 7, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-emerald);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-emerald);
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px var(--emerald-glow);
    }

    .header-actions {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .icon-btn {
      background: var(--emerald-subtle);
      border: 1px solid var(--border-emerald);
      color: var(--accent-emerald);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--accent-emerald);
      color: #000;
      box-shadow: 0 0 10px var(--emerald-glow);
    }

    /* Content Screens */
    .content-area {
      flex: 1;
      padding-bottom: 80px;
      overflow-y: auto;
    }

    .screen {
      display: none;
      padding: 1rem;
    }

    .screen.active {
      display: block;
    }

    /* Navigation Bar */
    .nav-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: rgba(5, 11, 7, 0.95);
      backdrop-filter: blur(15px);
      border-top: 1px solid var(--border-emerald);
      display: flex;
      justify-content: space-around;
      padding: 0.75rem 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .nav-item.active {
      color: var(--accent-emerald);
      text-shadow: 0 0 8px var(--emerald-glow);
    }

    .nav-item i {
      width: 22px;
      height: 22px;
    }

    /* Feed Posts */
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-emerald);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1.2rem;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.8rem;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--emerald-subtle);
      border: 1px solid var(--border-emerald);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-emerald);
      font-weight: 700;
    }

    .post-meta h4 {
      font-size: 0.9rem;
      color: #fff;
    }

    .post-meta span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .post-content {
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 0.8rem;
      color: #e0f2e7;
    }

    .post-media {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 0.8rem;
      border: 1px solid var(--emerald-subtle);
    }

    .post-actions {
      display: flex;
      gap: 1.2rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--emerald-subtle);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    /* Broadcast Global Room */
    .chat-box {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 160px);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding-right: 0.3rem;
    }

    .message-bubble {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .message-bubble.other {
      background: var(--bg-card);
      border: 1px solid var(--border-emerald);
      align-self: flex-start;
    }

    .message-bubble.mine {
      background: var(--emerald-subtle);
      border: 1px solid var(--accent-emerald);
      color: #fff;
      align-self: flex-end;
    }

    .msg-author {
      font-size: 0.7rem;
      color: var(--accent-emerald);
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .chat-input-bar {
      display: flex;
      gap: 0.5rem;
      padding-top: 0.8rem;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--accent-emerald);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 0 25px var(--emerald-glow);
    }
  </style>
</head>
<body>

  <!-- AUTH SECTION -->
  <div id="authScreen" class="auth-container">
    <h1 class="auth-title">MIDNIGHT ARC</h1>
    <p class="auth-subtitle">Glowing Emerald Protocol • Live Broadcast Network</p>

    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="user@domain.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
      </div>
      <button class="btn-emerald" onclick="handleLogin()">ENTER NETWORK</button>
      <div class="auth-toggle">
        Need an account? <span onclick="toggleAuthMode('register')">Register here</span>
      </div>
    </div>

    <div id="registerForm" style="display: none;">
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="regName" class="form-control" placeholder="e.g. Arc Knight">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" class="form-control" placeholder="user@domain.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="••••••••">
      </div>
      <button class="btn-emerald" onclick="handleRegister()">CREATE IDENTITY</button>
      <div class="auth-toggle">
        Already registered? <span onclick="toggleAuthMode('login')">Login here</span>
      </div>
    </div>
  </div>

  <!-- MAIN APP SECTION -->
  <div id="appScreen" class="app-viewport" style="display: none;">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-logo">MIDNIGHT ARC</div>
      <div class="header-actions">
        <button class="icon-btn" title="Create Post" onclick="openModal('createPostModal')">
          <i data-lucide="plus"></i>
        </button>
        <button class="icon-btn" title="Logout" onclick="handleLogout()">
          <i data-lucide="log-out"></i>
        </button>
      </div>
    </header>

    <!-- Main Screens -->
    <div class="content-area">
      <!-- SCREEN 1: FEED -->
      <div id="feedScreen" class="screen active">
        <div id="feedList"></div>
      </div>

      <!-- SCREEN 2: BROADCAST -->
      <div id="broadcastScreen" class="screen">
        <div class="chat-box">
          <div class="chat-messages" id="broadcastMessages"></div>
          <div class="chat-input-bar">
            <input type="text" id="broadcastInput" class="form-control" placeholder="Broadcast to all users...">
            <button class="btn-emerald" style="width: auto; padding: 0 1.2rem;" onclick="sendBroadcast()">Send</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="nav-bar">
      <div class="nav-item active" onclick="switchTab('feedScreen', this)">
        <i data-lucide="home"></i>
        <span>Feed</span>
      </div>
      <div class="nav-item" onclick="switchTab('broadcastScreen', this)">
        <i data-lucide="radio"></i>
        <span>Broadcast</span>
      </div>
    </nav>
  </div>

  <!-- MODAL: CREATE POST -->
  <div id="createPostModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 style="color: var(--accent-emerald); margin-bottom: 1rem;">New Broadcast Post</h3>
      <div class="form-group">
        <textarea id="postText" class="form-control" rows="3" placeholder="What's on your mind?"></textarea>
      </div>
      <div class="form-group">
        <input type="text" id="postImageUrl" class="form-control" placeholder="Image URL (Optional)">
      </div>
      <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
        <button class="btn-emerald" onclick="submitPost()">Publish</button>
        <button class="btn-emerald" style="background: transparent; color: #fff; border: 1px solid var(--border-emerald);" onclick="closeModal('createPostModal')">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // REPLACE WITH YOUR FIREBASE CONFIG (Firebase Console -> Project Settings)
    // -------------------------------------------------------------
   const firebaseConfig = {
  apiKey: "AIzaSyClnPRpAF2GqaaAMu3zBsO6PD7-A0e-RrY",
  authDomain: "midnight-arc.firebaseapp.com",
  projectId: "midnight-arc",
  storageBucket: "midnight-arc.firebasestorage.app",
  messagingSenderId: "632290572510",
  appId: "1:632290572510:web:ebf3c63dd888f5f48cea4f",
  measurementId: "G-YDNTNFB023"
};

    let db, auth;
    let currentUser = null;

    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.log("Firebase config not loaded yet.");
    }

    lucide.createIcons();

    function toggleAuthMode(mode) {
      document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = mode === 'register' ? 'block' : 'none';
    }

    function switchTab(screenId, el) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      el.classList.add('active');
    }
  </script>
</body>
</html>
